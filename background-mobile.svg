<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1600" preserveAspectRatio="xMidYMid slice">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#182d61"/>
    <stop offset="0.34" stop-color="#334c91"/>
    <stop offset="0.58" stop-color="#7773a7"/>
    <stop offset="0.72" stop-color="#5e557f"/>
    <stop offset="1" stop-color="#15172b"/>
