  <radialGradient id="mist" cx="50%" cy="63%" r="62%">
    <stop offset="0" stop-color="#c4b8e1" stop-opacity=".30"/>
    <stop offset=".55" stop-color="#8b82bd" stop-opacity=".12"/>
    <stop offset="1" stop-color="#07101f" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#45466b" stop-opacity=".18"/>
    <stop offset=".45" stop-color="#202844" stop-opacity=".58"/>
    <stop offset="1" stop-color="#080d19" stop-opacity=".94"/>
  </linearGradient>
  <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
</defs>
<rect width="1000" height="1600" fill="url(#sky)"/>
<rect width="1000" height="1600" fill="url(#mist)"/>

